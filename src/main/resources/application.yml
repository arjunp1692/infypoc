server:
  port: 8080

spring:
  application:
    name: sentinelflow
  mvc:
    problemdetails:
      enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:file:./data/sentinelflow;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

sentinelflow:
  suppression:
    enabled: true
    window: PT15M
  ai:
    base-url: https://api.openai.com/v1
    api-key: ${SENTINELFLOW_AI_API_KEY:}
    model: gpt-4o-mini
    timeout: 3s
    max-summary-length: 400
