spring:
  datasource:
    url: jdbc:h2:mem:sentinelflow;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

sentinelflow:
  suppression:
    enabled: true
    window: PT15M
  ai:
    base-url: http://127.0.0.1:9
    api-key: ""
    model: none
    timeout: 3s
    max-summary-length: 400
